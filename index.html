<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ising Model Simulation</title>

    <!-- CSS Styling -->
    <link rel="stylesheet" href="./src/style.css" />

    <!-- LaTeX Styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar">
        <h2>Ising Model Controls</h2>

        <div class="control-group">
          <label for="temp">Temperature ($T$): <span id="temp-val">2.27</span></label>
          <input type="range" id="temp" min="0.1" max="5.0" step="0.01" value="2.27" />
          <small class="hint">Critical Temp $T_{\rm c}\approx 2.269$</small>
        </div>

        <div class="control-group">
          <label for="field">Magnetic Field ($H$): <span id="field-val">0.00</span></label>
          <input type="range" id="field" min="-2.0" max="2.0" step="0.05" value="0.0" />
        </div>

        <div class="control-group">
          <label for="coupling">Coupling Constant ($J$): <span id="j-val">1.00</span></label>
          <input type="range" id="coupling" min="-2.0" max="2.0" step="0.1" value="1.0" />
          <small class="hint">$J > 0$ Ferromagnetic | $J &lt; 0$ Antiferromagnetic</small>
        </div>

        <div class="control-group">
          <label for="boundary">Boundary Condition</label>
          <select id="boundary">
            <option value="periodic">Periodic (Infinite Bulk)</option>
            <option value="open">Open / Free (Surface)</option>
            <option value="fixed">Fixed (+1 Wall)</option>
          </select>
        </div>

        <button id="reset-btn">Reset Grid (Random)</button>
      </aside>

      <main class="main-content">
        <div class="view-panel">
          <h3>Lattice Visualization</h3>
          <canvas id="grid-canvas"></canvas>
        </div>

        <div class="view-panel">
          <h3>Magnetization ($\langle M \rangle$) over Time</h3>
          <div class="chart-container">
            <canvas id="chart-canvas"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>

  </body>
</html>
